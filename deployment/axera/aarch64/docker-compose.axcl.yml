services:
  immich-machine-learning:
    # Use with docker-compose.ml.yml only.
    # Optional extra AXCL mapping for aarch64 deployments.
    # The base SoC runtime libraries are mapped by docker-compose.ml.yml.
    # Do not include this file unless the host AXCL library path exists.
    # If your board exposes a device node, uncomment devices below and verify the path first.
    volumes:
      - ${AXERA_LIB_PATH:-/usr/lib/axcl}:/usr/lib/axcl:ro
    environment:
      LD_LIBRARY_PATH: /usr/lib/axcl:${LD_LIBRARY_PATH:-}
    devices:
      - ${AXCL_DEVICE_AX_MMB:-/dev/ax_mmb_dev}:/dev/ax_mmb_dev
